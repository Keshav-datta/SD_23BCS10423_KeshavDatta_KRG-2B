version: "3.9"

services:
  # ─────────────── REDIS ───────────────
  # Used for: Distributed seat locking (prevents double-booking across pods)
  #           Event list caching (reduces DB reads)
  redis:
    image: redis:7-alpine
    container_name: ticketflow_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # ─────────────── ZOOKEEPER (required by Kafka) ───────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ticketflow_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ─────────────── KAFKA ───────────────
  # Used for: Async event publishing after booking/payment
  #           Topics: booking.confirmed, booking.failed, payment.processed
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ticketflow_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      retries: 5

  # ─────────────── ELASTICSEARCH ───────────────
  # Used for: Full-text event search (title, location, genre, description)
  #           High Availability — serves search even if DB is slow
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ticketflow_es
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=ticketflow-cluster
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      retries: 5
